<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근 · 근 디자인 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--accent:#ff4f82;--accent2:#ff84a8;--ink:#43232f;--muted:#bd8b9c;--rose:#f5326f;--soft:#ffe0ea}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  body{background:linear-gradient(160deg,#ffeef4,#ffe0ea);color:var(--ink);padding:30px 16px 60px;-webkit-font-smoothing:antialiased}
  h1{text-align:center;font-size:21px;font-weight:800}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 26px}
  .grid{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .card{background:#fff;border-radius:24px;padding:26px 20px 22px;box-shadow:0 18px 44px -22px rgba(150,50,90,.5);text-align:center}
  .num{display:inline-block;font-size:12px;font-weight:800;color:var(--rose);background:var(--soft);padding:5px 12px;border-radius:20px;margin-bottom:20px}
  .stage{height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.55}
  .desc b{color:var(--ink);font-weight:700}
  .w{font-size:62px;font-weight:800;letter-spacing:-3px;line-height:1;color:var(--ink)}
  .w .g{color:var(--accent);position:relative}
</style></head>
<body>
<h1>"두근"의 <span style="color:#ff4f82">근</span> 디자인 시안 💗</h1>
<div class="sub">로고타입에서 '근'을 포인트로 살린 5가지. 마음에 드는 번호를 알려주세요.</div>
<div class="grid">

  <!-- 1 펄스 언더라인 -->
  <div class="card">
    <span class="num">1 · 펄스 밑줄</span>
    <div class="stage">
      <div style="position:relative;display:inline-block">
        <span class="w">두<span class="g">근</span></span>
        <svg width="150" height="16" viewBox="0 0 150 16" fill="none" style="position:absolute;left:0;right:0;bottom:-10px;margin:auto">
          <path d="M2 9h30l5-7 7 13 5-9 4 5h84" stroke="url(#p1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <defs><linearGradient id="p1" x1="0" y1="0" x2="150" y2="0"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff3d77"/></linearGradient></defs>
        </svg>
      </div>
    </div>
    <div class="desc"><b>두근 아래 심장박동 밑줄</b><br>이름 뜻(두근거림)을 은은하게</div>
  </div>

  <!-- 2 하트 액센트 -->
  <div class="card">
    <span class="num">2 · 하트 액센트</span>
    <div class="stage">
      <span class="w">두<span class="g">근<svg width="22" height="20" viewBox="0 0 24 22" style="position:absolute;top:-6px;right:-16px" fill="none"><path d="M12 21S1 13.5 1 6.8C1 2.9 4 .5 7.4 1.4 9.5 2 11 3.8 12 5.4 13 3.8 14.5 2 16.6 1.4 20 .5 23 2.9 23 6.8 23 13.5 12 21 12 21z" fill="url(#h2)"/><defs><linearGradient id="h2" x1="1" y1="1" x2="23" y2="21"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff3d77"/></linearGradient></defs></svg></span></span>
    </div>
    <div class="desc"><b>근 위에 작은 하트</b><br>발랄하고 귀여운 포인트</div>
  </div>

  <!-- 3 받침을 하트로 -->
  <div class="card">
    <span class="num">3 · 하트 받침</span>
    <div class="stage">
      <span class="w">두<span class="g" style="color:var(--ink)">그<svg width="26" height="24" viewBox="0 0 24 22" style="position:absolute;left:50%;transform:translateX(-50%);bottom:-9px" fill="none"><path d="M12 21S1 13.5 1 6.8C1 2.9 4 .5 7.4 1.4 9.5 2 11 3.8 12 5.4 13 3.8 14.5 2 16.6 1.4 20 .5 23 2.9 23 6.8 23 13.5 12 21 12 21z" fill="url(#h3)"/><defs><linearGradient id="h3" x1="1" y1="1" x2="23" y2="21"><stop stop-color="#ff5f8e"/><stop offset="1" stop-color="#e8366c"/></linearGradient></defs></svg></span></span>
    </div>
    <div class="desc"><b>받침 'ㄴ'을 하트로</b><br>'그+하트'로 근을 형상화</div>
  </div>

  <!-- 4 펄스가 근을 관통 -->
  <div class="card">
    <span class="num">4 · 펄스 관통</span>
    <div class="stage">
      <span class="w">두<span class="g" style="color:#ffd0de">근<svg width="58" height="20" viewBox="0 0 58 20" style="position:absolute;left:50%;top:54%;transform:translate(-50%,-50%)" fill="none"><path d="M2 10h10l3-6 4.5 12 3-8 2 2h28" stroke="#ff3d77" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
    </div>
    <div class="desc"><b>연한 근 + 박동선 관통</b><br>로고 아이콘과 통일감</div>
  </div>

  <!-- 5 점을 하트로(ㅡ 위 강조) -->
  <div class="card">
    <span class="num">5 · 하트 도트</span>
    <div class="stage">
      <span class="w">두<span class="g">근</span><sup style="position:relative;top:-32px;left:-6px;display:inline-block"><svg width="15" height="14" viewBox="0 0 24 22" fill="none"><path d="M12 21S1 13.5 1 6.8C1 2.9 4 .5 7.4 1.4 9.5 2 11 3.8 12 5.4 13 3.8 14.5 2 16.6 1.4 20 .5 23 2.9 23 6.8 23 13.5 12 21 12 21z" fill="#ff3d77"/></svg></sup></span>
    </div>
    <div class="desc"><b>두근 옆 작은 하트 도트</b><br>심플 워드마크 + 한 끗</div>
  </div>

</div>
</body></html>
