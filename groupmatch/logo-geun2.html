<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근 · 근 디자인 업그레이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--accent:#ff4f82;--accent2:#ff84a8;--ink:#43232f;--muted:#bd8b9c;--rose:#f5326f;--soft:#ffe0ea}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  body{background:linear-gradient(160deg,#ffeef4,#ffe0ea);color:var(--ink);padding:30px 16px 60px;-webkit-font-smoothing:antialiased}
  h1{text-align:center;font-size:21px;font-weight:800}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 26px}
  .grid{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
  .card{background:#fff;border-radius:24px;padding:26px 22px 22px;box-shadow:0 18px 44px -22px rgba(150,50,90,.5);text-align:center}
  .num{display:inline-block;font-size:12px;font-weight:800;color:var(--rose);background:var(--soft);padding:5px 12px;border-radius:20px;margin-bottom:22px}
  .stage{height:96px;display:flex;align-items:center;justify-content:center;gap:13px;margin-bottom:14px}
  .ic{filter:drop-shadow(0 5px 11px rgba(255,61,119,.42));flex:none}
  .w{font-size:54px;font-weight:800;letter-spacing:-2.5px;line-height:1;color:var(--ink)}
  .w .g{color:var(--accent);position:relative}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.55}
  .desc b{color:var(--ink);font-weight:700}
</style></head>
<body>

<!-- 공통 아이콘 정의 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="tileG" x1="6" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="#ff8fb1"/><stop offset="1" stop-color="#ff3d77"/></linearGradient>
  <linearGradient id="glossG" x1="24" y1="0" x2="24" y2="13" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="pulseG" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff3d77"/></linearGradient>
  <symbol id="icon" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="13" fill="url(#tileG)"/>
    <path d="M13 0h22c7.2 0 13 5.8 13 13H0C0 5.8 5.8 0 13 0Z" fill="url(#glossG)"/>
    <path d="M24 37.5S8 28.4 8 18.3C8 12.9 12 9 16.6 9c3 0 5.5 1.7 7.4 4.2C25.9 10.7 28.4 9 31.4 9 36 9 40 12.9 40 18.3 40 28.4 24 37.5 24 37.5Z" fill="#fff"/>
    <path d="M14.5 23.5h3.2l2.1-5 3.4 10.5 2.4-6.6 1.6 2.1h6.3" fill="none" stroke="#ff3d77" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</defs></svg>

<h1>근 디자인 업그레이드 (1·4번) 💗</h1>
<div class="sub">아이콘과 함께 본 모습이에요. 마음에 드는 번호를 알려주세요.</div>
<div class="grid">

  <!-- 1A 펄스 밑줄 + 끝 하트 -->
  <div class="card">
    <span class="num">1A · 펄스밑줄+하트</span>
    <div class="stage">
      <svg class="ic" width="42" height="42"><use href="#icon"/></svg>
      <div style="position:relative">
        <span class="w">두<span class="g">근</span></span>
        <svg width="142" height="26" viewBox="0 0 142 26" fill="none" style="position:absolute;left:-2px;bottom:-13px">
          <path d="M2 14h34l5-9 6 16 4-11 3 6h58" stroke="url(#pulseG)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M132 9c-1.6-2.4-5-1.8-5 1.2 0 2 2.4 3.8 5 5.6 2.6-1.8 5-3.6 5-5.6 0-3-3.4-3.6-5-1.2Z" fill="#ff3d77"/>
        </svg>
      </div>
    </div>
    <div class="desc"><b>심장박동 밑줄 + 끝에 하트</b><br>두근거림 + 사랑을 함께</div>
  </div>

  <!-- 1B 펄스 밑줄(가운데 비트=하트) -->
  <div class="card">
    <span class="num">1B · 비트가 하트</span>
    <div class="stage">
      <svg class="ic" width="42" height="42"><use href="#icon"/></svg>
      <div style="position:relative">
        <span class="w">두<span class="g">근</span></span>
        <svg width="142" height="30" viewBox="0 0 142 30" fill="none" style="position:absolute;left:-2px;bottom:-15px">
          <path d="M2 17h44l4-4" stroke="url(#pulseG)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M64 9c-2-3-6.4-2.2-6.4 1.6 0 2.7 3.2 5.2 6.4 7.4 3.2-2.2 6.4-4.7 6.4-7.4C70.4 6.8 66 6 64 9Z" fill="#ff3d77"/>
          <path d="M76 13l4 4h60" stroke="url(#pulseG)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="desc"><b>밑줄의 솟구치는 비트를 하트로</b><br>가장 위트있는 버전</div>
  </div>

  <!-- 4A 분홍 근 + 흰 펄스 관통 -->
  <div class="card">
    <span class="num">4A · 흰 펄스 관통</span>
    <div class="stage">
      <svg class="ic" width="42" height="42"><use href="#icon"/></svg>
      <span class="w">두<span class="g">근<svg width="50" height="16" viewBox="0 0 50 16" fill="none" style="position:absolute;left:50%;top:60%;transform:translate(-50%,-50%)"><path d="M2 8h8l2.5-5 4 11 2.5-7 1.8 2H48" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
    </div>
    <div class="desc"><b>분홍 근을 흰 박동선이 관통</b><br>아이콘(흰하트+핑크펄스)과 음양 대비</div>
  </div>

  <!-- 4B 근 + 박동선 관통 + 솟구침 하트 -->
  <div class="card">
    <span class="num">4B · 관통+하트비트</span>
    <div class="stage">
      <svg class="ic" width="42" height="42"><use href="#icon"/></svg>
      <span class="w">두<span class="g">근<svg width="54" height="34" viewBox="0 0 54 34" fill="none" style="position:absolute;left:50%;top:55%;transform:translate(-50%,-50%)"><path d="M2 20h12l3-5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 9c-1.7-2.5-5.4-1.9-5.4 1.4 0 2.3 2.7 4.4 5.4 6.4 2.7-2 5.4-4.1 5.4-6.4C30.4 7.1 26.7 6.5 25 9Z" fill="#fff"/><path d="M33 14l3 6h16" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
    </div>
    <div class="desc"><b>관통 박동선의 솟구침을 하트로</b><br>4A + 1B를 합친 화려한 버전</div>
  </div>

</div>
</body></html>
