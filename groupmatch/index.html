<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근 — 혼자 와도 팀이 되는 그룹 소개팅</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css');
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
  :root{--accent:#ff4f82;--accent2:#ff84a8;--accent-press:#e8366c;--accent-soft:#ffe0ea;--ink:#43232f;--muted:#bd8b9c;--line:#ffd6e1;--rose:#f5326f}
  html,body{height:100%}
  body{color:var(--ink);overflow-x:hidden;
    background:radial-gradient(circle at 14% -5%,#ffc4d8 0%,transparent 46%),radial-gradient(circle at 88% 6%,#ffe0c8 0%,transparent 42%),linear-gradient(165deg,#ffe2ec,#ffc9dd);
    background-attachment:fixed}

  .hero{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center}
  /* 배경 오브 */
  .orb{position:absolute;border-radius:50%;filter:blur(72px);z-index:0}
  .o1{width:340px;height:340px;background:#ffabc6;top:-90px;left:-80px;opacity:.55}
  .o2{width:300px;height:300px;background:#ffd0a0;top:30px;right:-80px;opacity:.5}
  .o3{width:320px;height:320px;background:#ffbcd6;bottom:-40px;left:80px;opacity:.4}
  /* 떠다니는 하트 */
  .petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
  .petals span{position:absolute;bottom:-30px;color:#ff7ba3;opacity:0;font-size:18px;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.5}85%{opacity:.5}100%{transform:translateY(-105vh) rotate(28deg);opacity:0}}

  .brand{position:absolute;top:26px;left:32px;display:flex;align-items:center;gap:10px;z-index:8}
  .brand .m{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
  .brand b{font-size:21px;font-weight:800}.brand b i{color:var(--accent);font-style:normal}

  .copy{position:relative;z-index:5;text-align:center;padding:96px 22px 0;max-width:620px}
  .copy .lab{display:inline-block;font-size:12px;letter-spacing:2px;color:var(--rose);background:#fff;padding:7px 15px;border-radius:20px;box-shadow:0 6px 16px -8px rgba(255,80,120,.5);margin-bottom:18px;font-weight:700}
  .copy h1{font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1.2}
  .copy h1 em{font-style:normal;color:var(--rose)}
  .copy p{font-size:16.5px;color:#9b6f80;line-height:1.7;margin-top:14px}
  .cta{display:inline-block;margin-top:26px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;text-decoration:none;
    border-radius:16px;padding:16px 40px;font-size:16px;font-weight:800;box-shadow:0 16px 32px -12px rgba(255,79,130,.7);transition:transform .15s, filter .2s}
  .cta:hover{filter:brightness(1.05);transform:translateY(-2px)}

  /* 플로팅 장식 (데스크톱) */
  .floaty{position:absolute;z-index:6}
  .float{background:#fff;border-radius:16px;box-shadow:0 16px 34px -16px rgba(150,50,90,.45);padding:12px 15px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .float .pct{color:var(--rose);font-weight:800}
  .f1{top:330px;left:7%}.f2{top:300px;right:7%;border-bottom-left-radius:4px}
  .tile{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 14px 30px -14px rgba(150,50,90,.4)}
  .t1{top:250px;left:15%;background:#fff3d9;transform:rotate(-8deg)}
  .t2{top:440px;left:18%;background:#ffe0e6;transform:rotate(7deg)}
  .t3{top:235px;right:15%;background:#e9e2ff;transform:rotate(9deg)}
  .t4{top:455px;right:17%;background:#dff0e4;transform:rotate(-7deg)}
  .pcard{background:#fff;border-radius:18px;box-shadow:0 18px 36px -16px rgba(150,40,80,.45);padding:12px 15px;display:flex;align-items:center;gap:10px}
  .pcard .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:none}
  .pcard .nm{font-size:13.5px;font-weight:700}.pcard .ds{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pL{top:430px;left:9%;transform:rotate(-5deg)}.pR{top:400px;right:8%;transform:rotate(5deg)}

  /* 하단 걸친 폰 */
  .device{position:relative;z-index:5;margin-top:38px;width:336px;max-width:88vw;height:560px;background:#fff;border-radius:40px 40px 0 0;
    box-shadow:0 -10px 60px -20px rgba(150,50,90,.45);overflow:hidden}
  .sheet{height:100%;padding:30px 24px;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff7f9,#fff)}
  .topbar{font-size:12.5px;color:var(--muted);margin-bottom:18px}
  .prog{height:6px;background:#ffe1ea;border-radius:99px;margin-bottom:20px;overflow:hidden}
  .prog i{display:block;height:100%;width:55%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .dot{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:8px}
  .q{font-size:22px;font-weight:800;line-height:1.34;letter-spacing:-.5px;margin-bottom:6px}
  .pp{font-size:12.5px;color:var(--muted);margin-bottom:20px}
  .opt{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:11px;font-size:15px;font-weight:500;box-shadow:0 8px 18px -14px rgba(180,40,90,.5)}
  .opt .emo{font-size:18px}.opt .txt{flex:1}
  .opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #f0cfda;flex:none}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .rd{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px #fff}

  @media (max-width:900px){
    .floaty{display:none}
    .copy{padding-top:80px}
    .copy h1{font-size:34px}
    .copy p{font-size:15px}
    .o1,.o2,.o3{opacity:.4}
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div class="petals">
      <span style="left:8%;animation-duration:15s"></span><span style="left:26%;animation-duration:19s;animation-delay:4s"></span>
      <span style="left:50%;animation-duration:21s;animation-delay:2s"></span><span style="left:72%;animation-duration:16s;animation-delay:6s"></span>
      <span style="left:90%;animation-duration:18s;animation-delay:1s"></span>
    </div>

    <div class="brand"><span class="m">💞</span><b>두<i>근</i></b></div>

    <!-- 플로팅 장식 (데스크톱) -->
    <div class="floaty tile t1">☕</div><div class="floaty tile t2">🍷</div>
    <div class="floaty tile t3">💌</div><div class="floaty tile t4">🎳</div>
    <div class="floaty float f1">💞 매칭 <span class="pct">92%</span></div>
    <div class="floaty float f2">“오늘 카페 어때요?” ☕</div>
    <div class="floaty pcard pL"><span class="av" style="background:#ff84a8">지</span><div><div class="nm">지은 · 28</div><div class="ds">☕ 강남 · 카페</div></div></div>
    <div class="floaty pcard pR"><span class="av" style="background:#9aa7e8">현</span><div><div class="nm">현우 · 31</div><div class="ds">🎳 성수 · 액티비티</div></div></div>

    <div class="copy">
      <span class="lab">GROUP BLIND DATE</span>
      <h1>혼자 와도, <em>설렘</em>은 함께.</h1>
      <p>AI가 잘 맞는 사람을 찾아,<br>두근거리는 만남으로 이어드려요.</p>
      <a class="cta" href="apply.html">신청 시작하기 →</a>
    </div>

    <!-- 하단 걸친 폰 미리보기 -->
    <div class="device"><div class="sheet">
      <div class="topbar">✕ &nbsp;두근 소개팅 신청</div>
      <div class="prog"><i></i></div>
      <div class="dot">STEP 05 · 09</div>
      <div class="q">어떤 분위기의<br>만남이 설레나요?</div>
      <div class="pp">취향이 맞는 분과 이어드릴게요</div>
      <div class="opt sel"><span class="emo">☕</span><span class="txt">카페에서 차분하게</span><span class="rd"></span></div>
      <div class="opt"><span class="emo">🍷</span><span class="txt">가볍게 한잔하며</span><span class="rd"></span></div>
      <div class="opt"><span class="emo">🎳</span><span class="txt">액티비티 즐기며</span><span class="rd"></span></div>
    </div></div>
  </div>
</body>
</html>
