<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근 — 그룹 소개팅 신청</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css');
  :root{
    --bg:#f6f3f1; --ink:#241f1d; --muted:#a59a94;
    --accent:#e8553e; --accent-soft:#fdeee9; --accent-press:#d44730;
    --card:#ffffff; --line:#ebe3df; --ring:rgba(232,85,62,.16);
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font);background:var(--bg);color:var(--ink);
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }

  /* 2단 레이아웃 (좌: 브랜드 / 우: 폼) */
  .page{
    display:grid;grid-template-columns:0.92fr 1.08fr;
    max-width:1180px;margin:0 auto;min-height:100vh;
  }
  .brand{
    position:sticky;top:0;align-self:start;height:100vh;
    background:linear-gradient(165deg,#fff4f0 0%,#fbe7e0 58%,#f6dcd2 100%);
    border-right:1px solid var(--line);
    display:flex;align-items:center;padding:64px 56px;
  }
  .brand-inner{max-width:380px}
  .viz{position:relative;width:100%;height:218px;margin-bottom:28px}
  .viz .ava{position:absolute;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:19px;border:3px solid #fff;box-shadow:0 8px 20px -6px rgba(0,0,0,.18)}
  .viz .vheart{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:29px;box-shadow:0 10px 24px -6px rgba(232,85,62,.4);z-index:5}
  .badge{
    display:inline-block;font-size:12px;letter-spacing:.3px;color:var(--accent);
    background:#fff;padding:7px 14px;border-radius:20px;margin-bottom:22px;
    box-shadow:0 3px 10px -5px var(--ring);
  }
  .logo{display:flex;align-items:center;gap:13px;margin-bottom:8px}
  .logo-mark{
    width:48px;height:48px;border-radius:15px;flex:none;
    background:linear-gradient(140deg,#f4836b,var(--accent));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 20px -7px var(--ring);
  }
  .logo-mark svg{width:26px;height:26px}
  .logo-word{font-size:36px;font-weight:800;letter-spacing:-2px;color:var(--ink)}
  .logo-word b{color:var(--accent)}
  .brand p{font-size:16px;color:#7b6e68;line-height:1.75;margin-top:16px;white-space:pre-line}
  .values{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:13px}
  .values li{position:relative;padding-left:26px;font-size:14.5px;color:#6e5f58;line-height:1.5}
  .values li::before{
    content:'';position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);
  }

  /* 폼 컬럼 */
  .form-col{padding:52px 56px 72px;display:flex;flex-direction:column;justify-content:center}
  .form-inner{width:100%;max-width:440px;margin:0 auto}

  @media (max-width:880px){
    .page{grid-template-columns:1fr;max-width:560px}
    .brand{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:40px 26px 30px;align-items:flex-start}
    .brand-inner{max-width:none}
    .logo-word{font-size:30px}
    .logo-mark{width:42px;height:42px;border-radius:13px}
    .logo-mark svg{width:23px;height:23px}
    .brand p{font-size:15px}
    .values{display:none}
    .form-col{padding:6px 24px 56px}
  }

  /* 진행바 */
  .progress-wrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 18px;margin-bottom:6px}
  .progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress div{height:100%;background:linear-gradient(90deg,#f0795f,var(--accent));width:0%;transition:width .45s cubic-bezier(.2,.8,.3,1);border-radius:99px}

  /* 질문 카드 */
  .q{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:22px 20px;margin-bottom:12px;
    opacity:.5;filter:saturate(.6);pointer-events:none;
    transition:opacity .3s, box-shadow .3s, border-color .3s, filter .3s, transform .3s;
  }
  .q.active{
    opacity:1;filter:none;pointer-events:auto;border-color:#f3d7cf;
    box-shadow:0 10px 30px -12px rgba(200,90,60,.28);
  }
  .q.done{opacity:1;filter:none;pointer-events:auto}
  .q label{display:block;font-family:var(--font);font-size:16px;font-weight:600;margin-bottom:14px;line-height:1.4}
  .q label small{display:block;font-family:var(--font);font-weight:400;font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}

  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{
    padding:11px 16px;border:1.5px solid var(--line);border-radius:14px;
    font-size:14px;cursor:pointer;background:#fcfaf9;transition:.15s;user-select:none;line-height:1.2;
  }
  .opt:hover{border-color:#f0a795;background:#fff}
  .opt.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 12px -3px var(--ring)}

  input[type=text],input[type=number],textarea{
    width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;
    font-family:inherit;font-size:15px;background:#fcfaf9;color:var(--ink);outline:none;transition:.15s;
  }
  input::placeholder,textarea::placeholder{color:#c4b8b2}
  input:focus,textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px var(--ring)}
  textarea{resize:none;height:78px;line-height:1.5}

  .submit{
    width:100%;padding:17px;border:none;border-radius:16px;cursor:pointer;
    font-family:var(--font);font-size:16px;font-weight:700;
    background:var(--accent);color:#fff;margin-top:18px;
    transition:opacity .25s, transform .15s, background .2s, box-shadow .2s;
    opacity:.35;pointer-events:none;
  }
  .submit.ready{opacity:1;pointer-events:auto;box-shadow:0 12px 26px -10px var(--ring)}
  .submit.ready:hover{background:var(--accent-press)}
  .submit.ready:active{transform:translateY(1px)}

  .done-screen{display:none;text-align:center;padding:90px 24px}
  .done-screen.show{display:block;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .done-screen .heart{font-size:56px}
  .done-screen h2{font-family:var(--font);font-size:25px;margin:16px 0 10px;color:var(--accent)}
  .done-screen p{font-size:14px;color:var(--muted);line-height:1.9}

  .privacy{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="page">

  <aside class="brand">
    <div class="brand-inner">
      <div class="viz">
        <div class="ava" style="background:#e8553e;left:4%;top:4%">주</div>
        <div class="ava" style="background:#d9a441;left:0;top:44%">민</div>
        <div class="ava" style="background:#c9784f;left:15%;top:80%">하</div>
        <div class="vheart">💞</div>
        <div class="ava" style="background:#6a8caf;right:4%;top:4%">강</div>
        <div class="ava" style="background:#7a9e7e;right:0;top:44%">한</div>
        <div class="ava" style="background:#b06a9e;right:15%;top:80%">민</div>
      </div>
      <div class="logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 20.5C12 20.5 3.5 15.6 3.5 9.4C3.5 6.6 5.7 4.5 8.4 4.5C10 4.5 11.4 5.3 12 6.5C12.6 5.3 14 4.5 15.6 4.5C18.3 4.5 20.5 6.6 20.5 9.4C20.5 15.6 12 20.5 12 20.5Z" fill="#fff" fill-opacity="0.22"/>
            <path d="M4 12.5H8.2L9.8 8.7L12 15.3L14 11.5L15.2 12.5H20" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="logo-word">두<b>근</b></span>
      </div>
      <p id="heroCopy"></p>
    </div>
  </aside>

  <main class="form-col">
    <div class="form-inner">

  <div id="formArea">
    <div class="progress-wrap"><div class="progress"><div id="bar"></div></div></div>

    <!-- Q1 성별 -->
    <div class="q active" data-q="gender">
      <label>성별을 알려주세요</label>
      <div class="opts">
        <div class="opt" data-v="M">남성</div>
        <div class="opt" data-v="F">여성</div>
      </div>
    </div>

    <!-- Q2 출생연도 -->
    <div class="q" data-q="birth_year">
      <label>출생연도</label>
      <input type="number" placeholder="예: 1996" min="1970" max="2007" id="in-birth">
    </div>

    <!-- Q3 지역 -->
    <div class="q" data-q="region">
      <label>주로 활동하는 지역 <small>그룹은 같은 지역끼리 묶어드려요</small></label>
      <div class="opts">
        <div class="opt" data-v="강남/서초">강남·서초</div>
        <div class="opt" data-v="홍대/마포">홍대·마포</div>
        <div class="opt" data-v="성수/건대">성수·건대</div>
        <div class="opt" data-v="잠실/송파">잠실·송파</div>
        <div class="opt" data-v="기타서울">기타 서울</div>
        <div class="opt" data-v="경기/인천">경기·인천</div>
      </div>
    </div>

    <!-- Q4 직업 -->
    <div class="q" data-q="job">
      <label>직업/소속 <small>그룹 밸런스를 맞추는 데만 써요</small></label>
      <input type="text" placeholder="예: IT 회사원, 디자이너, 대학원생" id="in-job">
    </div>

    <!-- Q5 만남 스타일 -->
    <div class="q" data-q="meet_style">
      <label>선호하는 만남 분위기</label>
      <div class="opts">
        <div class="opt" data-v="술">🍻 가볍게 술 한잔</div>
        <div class="opt" data-v="카페">☕ 카페에서 차분하게</div>
        <div class="opt" data-v="액티비티">🎳 액티비티 (볼링·보드게임 등)</div>
      </div>
    </div>

    <!-- Q6 가능 시간 -->
    <div class="q" data-q="available">
      <label>주로 가능한 시간대</label>
      <div class="opts">
        <div class="opt" data-v="평일저녁">평일 저녁</div>
        <div class="opt" data-v="금요일">금요일 밤</div>
        <div class="opt" data-v="주말낮">주말 낮</div>
        <div class="opt" data-v="주말저녁">주말 저녁</div>
      </div>
    </div>

    <!-- Q7 자기소개 -->
    <div class="q" data-q="intro">
      <label>나를 한 줄로 소개한다면 <small>같은 그룹이 될 분들에게 보여드려요</small></label>
      <textarea placeholder="예: 처음엔 낯가리는데 친해지면 제일 시끄러운 사람" id="in-intro"></textarea>
    </div>

    <!-- Q8 WTP -->
    <div class="q" data-q="wtp">
      <label>매칭이 성사되면 참가비 1만원, 어떠세요? <small>솔직하게 답해주실수록 좋은 서비스가 돼요</small></label>
      <div class="opts">
        <div class="opt" data-v="yes">낼 의향 있어요</div>
        <div class="opt" data-v="maybe">상황 봐서요</div>
        <div class="opt" data-v="no">무료면 할래요</div>
      </div>
    </div>

    <!-- Q9 연락처 -->
    <div class="q" data-q="kakao_id">
      <label>카카오톡 ID <small>그룹이 구성되면 이 ID로 연락드려요</small></label>
      <input type="text" placeholder="카톡 ID 입력" id="in-kakao">
    </div>

    <button class="submit" id="submitBtn">신청 완료하기</button>
    <div class="privacy">입력하신 정보는 그룹 구성과 매칭 연락에만 사용되며,<br>요청 시 즉시 파기됩니다.</div>
  </div>

  <div class="done-screen" id="doneScreen">
    <div class="heart">💌</div>
    <h2>신청 완료!</h2>
    <p>잘 맞는 분들로 그룹을 구성해서<br>카카오톡으로 연락드릴게요.<br><br>보통 3~7일 정도 걸려요.</p>
  </div>

    </div>
  </main>

</div>

<script>
// =====================================================
// 트래킹 설정 — Supabase 키만 채우면 동작
// =====================================================
const SUPABASE_URL = 'https://wjjiacepvfamqnwmatkp.supabase.co';        // 예: https://xxxx.supabase.co
const SUPABASE_ANON_KEY = 'sb_publishable_Pz-ciZrqsgZErtYOGH-S3g_REY6_In9';

// ---------- 세션 / UTM / A·B 배정 ----------
const sessionId = crypto.randomUUID();
const params = new URLSearchParams(location.search);
const utm = {
  utm_source: params.get('utm_source') || 'direct',
  utm_campaign: params.get('utm_campaign') || '',
};
// A/B: 카피 두 버전 랜덤 배정 (URL로 강제하려면 ?v=A)
const variant = params.get('v') || (Math.random() < 0.5 ? 'A' : 'B');
const COPY = {
  A: '혼자 신청하세요. 잘 맞는 사람들로 팀을 짜서,\n괜찮은 상대 팀과 만남을 잡아드려요.',
  B: '소개팅은 부담스럽고, 미팅은 멤버 모으기 힘들죠.\n혼자 와도 팀이 되는 그룹 소개팅.',
};
document.getElementById('heroCopy').innerText = COPY[variant];

// ---------- 이벤트 적재 ----------
function logEvent(name, props = {}, useBeacon = false) {
  const body = JSON.stringify({
    p_event_name: name, p_user_id: null, p_group_id: null,
    p_session_id: sessionId,
    p_props: { ...props, variant, ...utm },
  });
  // sendBeacon은 자격증명(credentials)을 강제로 포함해 Supabase의 와일드카드 CORS와 충돌함.
  // fetch + keepalive로 교체 → 페이지 이탈 시에도 전송을 보장하면서 CORS 문제 회피.
  fetch(`${SUPABASE_URL}/rest/v1/rpc/log_event`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    },
    body,
    keepalive: useBeacon,
  }).catch(() => {});
}

// ---------- 폼 상태 ----------
const answers = {};
const qEls = [...document.querySelectorAll('.q')];
const order = qEls.map(el => el.dataset.q);
let qStartTime = Date.now();
let submitted = false;

logEvent('form_viewed', { referrer: document.referrer });

function answer(qid, value) {
  const isNew = !(qid in answers);
  answers[qid] = value;
  if (isNew) {
    logEvent('question_answered', {
      question_id: qid,
      elapsed_ms: Date.now() - qStartTime,
    });
    qStartTime = Date.now();
  }
  advance();
}

function advance() {
  let activated = false;
  qEls.forEach(el => {
    const qid = el.dataset.q;
    if (qid in answers) {
      el.classList.add('done'); el.classList.remove('active');
    } else if (!activated) {
      el.classList.add('active'); activated = true;
    }
  });
  const doneCount = Object.keys(answers).length;
  document.getElementById('bar').style.width = (doneCount / order.length * 100) + '%';
  const btn = document.getElementById('submitBtn');
  btn.classList.toggle('ready', doneCount === order.length);
  // 다음 미응답 문항으로 스크롤
  const next = qEls.find(el => el.classList.contains('active'));
  if (next && doneCount > 0) next.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// 선택형 문항
qEls.forEach(el => {
  el.querySelectorAll('.opt').forEach(opt => {
    opt.onclick = () => {
      el.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
      opt.classList.add('sel');
      answer(el.dataset.q, opt.dataset.v);
    };
  });
});

// 입력형 문항 (blur 시 확정)
const textInputs = [
  ['in-birth', 'birth_year'], ['in-job', 'job'],
  ['in-intro', 'intro'], ['in-kakao', 'kakao_id'],
];
textInputs.forEach(([id, qid]) => {
  const el = document.getElementById(id);
  el.addEventListener('blur', () => {
    if (el.value.trim()) answer(qid, el.value.trim());
  });
});

// ---------- 제출 ----------
document.getElementById('submitBtn').onclick = async () => {
  submitted = true;
  logEvent('form_submitted', { answers_count: Object.keys(answers).length });
  // applicants 테이블 적재
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/applicants`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({
        session_id: sessionId,
        gender: answers.gender,
        birth_year: parseInt(answers.birth_year),
        region: answers.region,
        job: answers.job || null,
        meet_style: answers.meet_style || null,
        available: answers.available || null,
        intro: answers.intro || null,
        kakao_id: answers.kakao_id,
        wtp: answers.wtp || null,
        utm_source: utm.utm_source,
        variant,
      }),
    });
  } catch (e) { /* 이벤트는 이미 적재됨 */ }
  document.getElementById('formArea').style.display = 'none';
  document.getElementById('doneScreen').classList.add('show');
};

// ---------- 이탈 감지 (핵심) ----------
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && !submitted) {
    const answered = Object.keys(answers);
    const lastQ = answered.length ? answered[answered.length - 1] : null;
    const nextQ = order.find(q => !(q in answers)) || null;
    logEvent('form_abandoned', {
      last_answered: lastQ,
      stuck_on: nextQ,                 // ← 어느 문항에서 멈췄는가
      progress: answered.length + '/' + order.length,
    }, true);                          // sendBeacon으로 전송 보장
  }
});
</script>
</body>
</html>
