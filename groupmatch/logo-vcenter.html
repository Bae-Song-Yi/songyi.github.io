<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근 · 펄스 세로중앙</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--accent:#ff4f82;--accent2:#ff84a8;--ink:#43232f;--muted:#bd8b9c;--rose:#f5326f;--soft:#ffe0ea}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  body{background:linear-gradient(160deg,#ffeef4,#ffe0ea);color:var(--ink);padding:30px 16px 60px;-webkit-font-smoothing:antialiased}
  h1{text-align:center;font-size:21px;font-weight:800}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 26px}
  .grid{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
  .card{background:#fff;border-radius:24px;padding:26px 22px 22px;box-shadow:0 18px 44px -22px rgba(150,50,90,.5);text-align:center}
  .num{display:inline-block;font-size:12px;font-weight:800;color:var(--rose);background:var(--soft);padding:5px 12px;border-radius:20px;margin-bottom:20px}
  .stage{display:flex;align-items:center;justify-content:center;gap:34px;height:90px;margin-bottom:14px}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.5}
  .wm{position:relative;display:inline-block;line-height:1}
  .wm b{font-weight:800;letter-spacing:-1px;position:relative}
  .wm b i{color:var(--accent);font-style:normal}
  .big b{font-size:48px;letter-spacing:-2px}.sml b{font-size:23px}
  .pulse{position:absolute;left:0;width:100%;height:auto;display:block;top:50%;transform:translateY(-50%)}
</style></head>
<body>
<h1>심장박동 라인 = "두근" 세로 중앙 💗</h1>
<div class="sub">라인이 글자 가운데 높이를 지나가요. 왼쪽 크게 / 오른쪽 실제 크기.</div>
<div class="grid">

  <!-- 1 앞으로 관통 -->
  <div class="card">
    <span class="num">1 · 글자 위로 관통</span>
    <div class="stage">
      <span class="wm big"><b>두<i>근</i></b><svg class="pulse" viewBox="0 0 142 26" fill="none" style="z-index:2"><path d="M2 13h34l5-9 6 16 4-11 3 6h58" stroke="url(#q1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 8c-1.6-2.4-5-1.8-5 1.2 0 2 2.4 3.8 5 5.6 2.6-1.8 5-3.6 5-5.6 0-3-3.4-3.6-5-1.2Z" fill="#ff3d77"/><defs><linearGradient id="q1" x1="0" y1="0" x2="142" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff3d77"/></linearGradient></defs></svg></span>
      <span class="wm sml"><b>두<i>근</i></b><svg class="pulse" viewBox="0 0 142 26" fill="none" style="z-index:2"><path d="M2 13h34l5-9 6 16 4-11 3 6h58" stroke="url(#q1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 8c-1.6-2.4-5-1.8-5 1.2 0 2 2.4 3.8 5 5.6 2.6-1.8 5-3.6 5-5.6 0-3-3.4-3.6-5-1.2Z" fill="#ff3d77"/></svg></span>
    </div>
    <div class="desc">라인이 글자 <b style="color:var(--ink)">앞으로</b> 지나감 (강렬)</div>
  </div>

  <!-- 2 뒤로 관통 -->
  <div class="card">
    <span class="num">2 · 글자 뒤로 관통</span>
    <div class="stage">
      <span class="wm big"><b style="z-index:2">두<i>근</i></b><svg class="pulse" viewBox="0 0 142 26" fill="none" style="z-index:1"><path d="M2 13h34l5-9 6 16 4-11 3 6h58" stroke="url(#q2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 8c-1.6-2.4-5-1.8-5 1.2 0 2 2.4 3.8 5 5.6 2.6-1.8 5-3.6 5-5.6 0-3-3.4-3.6-5-1.2Z" fill="#ff3d77"/><defs><linearGradient id="q2" x1="0" y1="0" x2="142" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff3d77"/></linearGradient></defs></svg></span>
      <span class="wm sml"><b style="z-index:2">두<i>근</i></b><svg class="pulse" viewBox="0 0 142 26" fill="none" style="z-index:1"><path d="M2 13h34l5-9 6 16 4-11 3 6h58" stroke="url(#q2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 8c-1.6-2.4-5-1.8-5 1.2 0 2 2.4 3.8 5 5.6 2.6-1.8 5-3.6 5-5.6 0-3-3.4-3.6-5-1.2Z" fill="#ff3d77"/></svg></span>
    </div>
    <div class="desc">라인이 글자 <b style="color:var(--ink)">뒤로</b> 지나감 (글자 또렷)</div>
  </div>

  <!-- 3 중앙 대칭 관통(앞) -->
  <div class="card">
    <span class="num">3 · 중앙대칭 관통</span>
    <div class="stage">
      <span class="wm big"><b>두<i>근</i></b><svg class="pulse" viewBox="0 0 142 26" fill="none" style="z-index:2"><path d="M4 13H54l5-9 6 18 5-13 4 6H138" stroke="url(#q3)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="q3" x1="0" y1="0" x2="142" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff3d77"/></linearGradient></defs></svg></span>
      <span class="wm sml"><b>두<i>근</i></b><svg class="pulse" viewBox="0 0 142 26" fill="none" style="z-index:2"><path d="M4 13H54l5-9 6 18 5-13 4 6H138" stroke="url(#q3)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <div class="desc">비트가 가운데 + 글자 앞으로 관통</div>
  </div>

</div>
</body></html>
