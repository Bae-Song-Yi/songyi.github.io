<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근 · 로고 중앙 배치</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--accent:#ff4f82;--accent2:#ff84a8;--ink:#43232f;--muted:#bd8b9c;--rose:#f5326f}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  body{background:#fbeef3;padding:24px 14px 50px;-webkit-font-smoothing:antialiased}
  .lab{text-align:center;font-size:12px;font-weight:800;color:var(--rose);margin-bottom:10px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px;margin:0 auto}
  .phone{background:linear-gradient(170deg,#ffd9e6,#ffe9d8);border-radius:34px;height:420px;padding:26px 22px;box-shadow:0 20px 50px -24px rgba(150,50,90,.5);position:relative;overflow:hidden}
  .cap{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);font-weight:700}
  /* 로고 */
  .wm{position:relative;display:inline-block;line-height:1}
  .wm b{font-size:23px;font-weight:800;letter-spacing:-1px}
  .wm b i{color:var(--accent);font-style:normal}
  .wm .pulse{position:absolute;left:0;bottom:-9px;width:100%;height:auto;display:block}
  /* 좌측 정렬(현재) */
  .topL{margin-top:18px}
  /* 중앙 정렬 */
  .topC{margin-top:18px;text-align:center}
  .hero{margin-top:60px;text-align:center}
  .chip{display:inline-block;background:#fff;color:var(--rose);font-size:11px;font-weight:800;letter-spacing:1.5px;padding:7px 14px;border-radius:20px;box-shadow:0 6px 16px -8px rgba(255,80,120,.5)}
  .hero h1{font-size:27px;font-weight:800;letter-spacing:-1px;margin-top:18px;color:var(--ink);line-height:1.25}
  .hero h1 em{font-style:normal;color:var(--rose)}
</style></head>
<body>
<div class="lab">왼쪽 = 현재(좌측) · 오른쪽 = 중앙 배치</div>
<div class="row">

  <!-- 좌측(현재) -->
  <div class="phone">
    <div class="cap">현재 · 좌측 상단</div>
    <div class="topL">
      <span class="wm"><b>두<i>근</i></b><svg class="pulse" viewBox="0 0 142 26" fill="none"><path d="M2 14h34l5-9 6 16 4-11 3 6h58" stroke="url(#pa)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 9c-1.6-2.4-5-1.8-5 1.2 0 2 2.4 3.8 5 5.6 2.6-1.8 5-3.6 5-5.6 0-3-3.4-3.6-5-1.2Z" fill="#ff3d77"/><defs><linearGradient id="pa" x1="0" y1="0" x2="142" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff3d77"/></linearGradient></defs></svg></span>
    </div>
    <div class="hero">
      <span class="chip">GROUP BLIND DATE</span>
      <h1>혼자 와도,<br><em>설렘</em>은 함께.</h1>
    </div>
  </div>

  <!-- 중앙 -->
  <div class="phone">
    <div class="cap">중앙 상단</div>
    <div class="topC">
      <span class="wm"><b>두<i>근</i></b><svg class="pulse" viewBox="0 0 142 26" fill="none"><path d="M4 14H54l5-9 6 18 5-13 4 6H138" stroke="url(#pb)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="pb" x1="0" y1="0" x2="142" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff3d77"/></linearGradient></defs></svg></span>
    </div>
    <div class="hero">
      <span class="chip">GROUP BLIND DATE</span>
      <h1>혼자 와도,<br><em>설렘</em>은 함께.</h1>
    </div>
  </div>

</div>
</body></html>
