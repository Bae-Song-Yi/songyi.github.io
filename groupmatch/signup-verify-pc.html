<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근 · 신청 인증 PC (아이콘)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--accent:#ff4f82;--accent2:#ff84a8;--accent-press:#e8366c;--accent-soft:#ffe0ea;--ink:#43232f;--muted:#bd8b9c;--line:#ffd6e1;--rose:#f5326f}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  html,body{height:100%}
  body{overflow:hidden;background:linear-gradient(135deg,#ffe3ee 0%,#ffd9e4 40%,#ffe7d6 100%);-webkit-font-smoothing:antialiased}
  .orb{position:fixed;border-radius:50%;filter:blur(72px);z-index:0}
  .o1{width:340px;height:340px;background:#ffabc6;top:-90px;left:-80px;opacity:.55}
  .o2{width:300px;height:300px;background:#ffd0a0;top:30px;right:-80px;opacity:.5}
  .o3{width:320px;height:320px;background:#ffc1d6;bottom:-120px;left:40%;opacity:.45}
  .brand{position:fixed;top:26px;left:32px;display:flex;align-items:center;gap:9px;z-index:9}
  .brand b{font-size:21px;font-weight:800}.brand b i{color:var(--accent);font-style:normal}
  .mk{filter:drop-shadow(0 5px 11px rgba(255,61,119,.4))}

  .floaty{position:absolute;z-index:6}
  .float{background:#fff;border-radius:16px;box-shadow:0 16px 34px -16px rgba(150,50,90,.45);padding:11px 15px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .float .pct{color:var(--rose);font-weight:800}
  .float svg{width:17px;height:17px;color:var(--accent);flex:none}
  .tile{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -14px rgba(150,50,90,.4)}
  .tile svg{width:28px;height:28px}
  .pcard{background:#fff;border-radius:18px;box-shadow:0 18px 36px -16px rgba(150,40,80,.45);padding:12px 15px;display:flex;align-items:center;gap:10px}
  .pcard .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:none}
  .pcard .nm{font-size:13.5px;font-weight:700}.pcard .ds{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px}
  .pcard .ds svg{width:13px;height:13px;color:var(--accent)}
  .f1{top:330px;left:7%}.f2{top:300px;right:7%;border-bottom-left-radius:4px}
  .t1{top:250px;left:15%;background:#fff3d9;color:#c98a2e;transform:rotate(-8deg)}.t2{top:440px;left:18%;background:#ffe0e6;color:var(--rose);transform:rotate(7deg)}
  .t3{top:235px;right:15%;background:#e9e2ff;color:#7b6ef0;transform:rotate(9deg)}.t4{top:455px;right:17%;background:#dff0e4;color:#36a86b;transform:rotate(-7deg)}
  .pL{top:430px;left:9%;transform:rotate(-5deg)}.pR{top:400px;right:8%;transform:rotate(5deg)}
  .f3{top:150px;left:8%}.f4{top:590px;right:7%}
  .t5{top:600px;left:6%;background:#ffe4d6;color:#e06a3a;transform:rotate(8deg)}.t6{top:150px;right:9%;background:#dfeafe;color:#4a7fd6;transform:rotate(-9deg)}

  .device{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:372px;height:min(800px,92vh);background:#fff;border-radius:40px;overflow:hidden;box-shadow:0 30px 80px -24px rgba(150,50,90,.6);display:flex;flex-direction:column}
  .in{flex:1;overflow-y:auto;padding:26px 24px 28px;scrollbar-width:none}
  .in::-webkit-scrollbar{display:none}
  .topbar{font-size:12.5px;color:var(--muted)}
  .prog{height:6px;background:#ffe1ea;border-radius:99px;margin:14px 0 20px;overflow:hidden}
  .prog i{display:block;height:100%;width:12%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}
  .ministep{font-size:11px;font-weight:800;color:var(--rose);letter-spacing:.5px;margin-bottom:7px}
  .q{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.3;display:flex;align-items:center;gap:8px}
  .q .sh{width:24px;height:24px;color:var(--accent);flex:none}
  .qs{font-size:13px;color:var(--muted);margin:9px 0 18px;line-height:1.55}
  .vcard{border:1.5px solid var(--line);border-radius:18px;padding:15px 15px 16px;margin-bottom:14px;background:#fff7f9}
  .vhead{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:800;margin-bottom:12px}
  .ico{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
  .ico svg{width:18px;height:18px}
  .vhead .st{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted)}
  input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;background:#fff;color:var(--ink);outline:none}
  input::placeholder{color:#cfa9b7}
  .row2{display:flex;gap:8px}.row2 input{flex:1}
  .btn{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;border-radius:12px;padding:13px 16px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
  .tabs{display:flex;gap:6px;margin-bottom:11px}
  .tab{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
  .tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-press)}
  .note{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:10px;background:#fff4f8;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .next{width:100%;margin-top:4px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;opacity:.4}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <g id="i-phone"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 18.6h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
  <g id="i-bldg"><path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 21V9h4a1 1 0 0 1 1 1v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 21h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7 8h3M7 12h3M7 16h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g>
  <g id="i-shield"><path d="M12 3l7 2.5v5.2c0 4.4-3 7.6-7 9.3-4-1.7-7-4.9-7-9.3V5.5L12 3z" fill="currentColor"/><path d="M8.5 12l2.3 2.3 4.5-4.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="i-heart"><path d="M12 21S3 14.5 3 8.8C3 5.6 5.4 3.4 8.2 4 9.9 4.4 11.2 5.6 12 7c.8-1.4 2.1-2.6 3.8-3C18.6 3.4 21 5.6 21 8.8 21 14.5 12 21 12 21z" fill="currentColor"/></g>
  <g id="i-coffee"><path d="M5 8h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M16 9.5h2a2.5 2.5 0 0 1 0 5h-2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 3.5v2M11.5 3.5v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></g>
  <g id="i-wine"><path d="M7 4h10l-1.2 6.5a3.8 3.8 0 0 1-7.6 0L7 4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 14.5V20M9 20h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></g>
  <g id="i-letter"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></g>
  <g id="i-act"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5c3 2.5 3 14.5 0 17M12 3.5c-3 2.5-3 14.5 0 17M3.6 12h16.8" fill="none" stroke="currentColor" stroke-width="1.5"/></g>
  <g id="i-flower"><path d="M12 12c-3 0-5-2-5-5 2 0 3.5 1 5 3 1.5-2 3-3 5-3 0 3-2 5-5 5z" fill="currentColor"/><path d="M12 12v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 16c-2 0-3.5-1-4-3M12 16c2 0 3.5-1 4-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></g>
  <g id="i-film"><rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 5v14M15 5v14M4 9.5h5M15 9.5h5M4 14.5h5M15 14.5h5" stroke="currentColor" stroke-width="1.3"/></g>
  <g id="i-spark"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6L12 3z" fill="currentColor"/></g>
</defs></svg>

  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="brand"><svg class="mk" width="34" height="31" viewBox="0 0 48 44" fill="none"><defs><linearGradient id="h" x1="6" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#ff8fb1"/><stop offset="1" stop-color="#ff3d77"/></linearGradient></defs><path d="M24 39S6 28.5 6 16.8C6 11 10.2 7 15.2 7c3.4 0 6.3 1.9 8.8 4.8C26.5 8.9 29.4 7 32.8 7 37.8 7 42 11 42 16.8 42 28.5 24 39 24 39Z" fill="url(#h)"/><path d="M10 22h4l2-4 2.5 7 2-9 2.5 11 2-5 1.6 2.5 1.4-1.5h6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>두<i>근</i></b></div>

  <div class="floaty tile t1"><svg viewBox="0 0 24 24"><use href="#i-coffee"/></svg></div>
  <div class="floaty tile t2"><svg viewBox="0 0 24 24"><use href="#i-wine"/></svg></div>
  <div class="floaty tile t3"><svg viewBox="0 0 24 24"><use href="#i-letter"/></svg></div>
  <div class="floaty tile t4"><svg viewBox="0 0 24 24"><use href="#i-act"/></svg></div>
  <div class="floaty tile t5"><svg viewBox="0 0 24 24"><use href="#i-flower"/></svg></div>
  <div class="floaty tile t6"><svg viewBox="0 0 24 24"><use href="#i-film"/></svg></div>
  <div class="floaty float f1"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg>매칭 <span class="pct">92%</span></div>
  <div class="floaty float f2"><svg viewBox="0 0 24 24"><use href="#i-coffee"/></svg>“오늘 카페 어때요?”</div>
  <div class="floaty float f3"><svg viewBox="0 0 24 24"><use href="#i-letter"/></svg>새 인연 도착!</div>
  <div class="floaty float f4"><svg viewBox="0 0 24 24"><use href="#i-spark"/></svg>이번 주 <span class="pct">38명</span> 신청</div>
  <div class="floaty pcard pL"><span class="av" style="background:#ff84a8">지</span><div><div class="nm">지은 · 28</div><div class="ds"><svg viewBox="0 0 24 24"><use href="#i-coffee"/></svg>강남 · 카페</div></div></div>
  <div class="floaty pcard pR"><span class="av" style="background:#9aa7e8">현</span><div><div class="nm">현우 · 31</div><div class="ds"><svg viewBox="0 0 24 24"><use href="#i-act"/></svg>성수 · 액티비티</div></div></div>

  <div class="device">
    <div class="in">
      <div class="topbar">✕&nbsp;&nbsp;두근 소개팅 신청</div>
      <div class="prog"><i></i></div>
      <div class="ministep">STEP 0 · 인증</div>
      <div class="q"><svg class="sh" viewBox="0 0 24 24"><use href="#i-shield"/></svg>안심 만남을 위한 인증</div>
      <div class="qs">서로 믿고 만날 수 있도록 본인과 직장을 가볍게 인증해요. 번호·메일은 공개되지 않고 매칭·연락에만 쓰여요.</div>

      <div class="vcard">
        <div class="vhead"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-phone"/></svg></span>휴대폰 본인인증<span class="st">미인증</span></div>
        <div class="row2"><input placeholder="010-0000-0000"><button class="btn">인증번호</button></div>
      </div>

      <div class="vcard">
        <div class="vhead"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-bldg"/></svg></span>직장 인증<span class="st">미인증</span></div>
        <div class="tabs"><div class="tab on">회사 이메일</div><div class="tab">명함 사진</div></div>
        <div class="row2"><input placeholder="you@company.com"><button class="btn">인증코드</button></div>
        <div class="note">회사 메일이 없으면 <b>명함 사진</b> 탭으로 인증할 수 있어요. 인증 완료 시 매칭 상대에게 <b>본인·직장인 인증</b> 뱃지가 보여요.</div>
      </div>

      <button class="next">신청 시작하기</button>
    </div>
  </div>
</body></html>
