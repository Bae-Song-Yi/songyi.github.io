<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근비트 로고 업그레이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--accent:#ff4f82;--accent2:#ff84a8;--ink:#43232f;--muted:#bd8b9c;--rose:#f5326f;--soft:#ffe0ea}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  body{background:linear-gradient(160deg,#ffeef4,#ffe0ea);color:var(--ink);padding:30px 16px 60px;-webkit-font-smoothing:antialiased}
  h1{text-align:center;font-size:21px;font-weight:800}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 26px}
  .grid{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .card{background:#fff;border-radius:24px;padding:24px 20px;box-shadow:0 18px 44px -22px rgba(150,50,90,.5);text-align:center}
  .num{display:inline-block;font-size:12px;font-weight:800;color:var(--rose);background:var(--soft);padding:5px 12px;border-radius:20px;margin-bottom:16px}
  .big{display:flex;justify-content:center;margin-bottom:18px}
  .row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
  .row b{font-size:23px;font-weight:800;letter-spacing:-1px}
  .row b i{color:var(--accent);font-style:normal}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.55}
  .desc b{color:var(--ink);font-weight:700}
  .ic{filter:drop-shadow(0 6px 12px rgba(255,61,119,.42))}
</style></head>
<body>
<h1>두근비트 로고 업그레이드 💗</h1>
<div class="sub">현재 것을 더 다듬은 4가지예요. 마음에 드는 번호를 알려주세요.</div>
<div class="grid">

  <!-- A: 현재 -->
  <div class="card">
    <span class="num">A · 현재</span>
    <div class="big">
      <svg class="ic" width="92" height="92" viewBox="0 0 48 48" fill="none"><defs><linearGradient id="ta" x1="6" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="#ff8fb1"/><stop offset="1" stop-color="#ff3d77"/></linearGradient><linearGradient id="ga" x1="24" y1="0" x2="24" y2="13" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#ta)"/><path d="M13 0h22c7.2 0 13 5.8 13 13H0C0 5.8 5.8 0 13 0Z" fill="url(#ga)"/><path d="M24 37.5S8 28.4 8 18.3C8 12.9 12 9 16.6 9c3 0 5.5 1.7 7.4 4.2C25.9 10.7 28.4 9 31.4 9 36 9 40 12.9 40 18.3 40 28.4 24 37.5 24 37.5Z" fill="#fff"/><path d="M14.5 23.5h3.2l2.1-5 3.4 10.5 2.4-6.6 1.6 2.1h6.3" fill="none" stroke="#ff3d77" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="row"><svg class="ic" width="34" height="34" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="13" fill="url(#ta)"/><path d="M24 37.5S8 28.4 8 18.3C8 12.9 12 9 16.6 9c3 0 5.5 1.7 7.4 4.2C25.9 10.7 28.4 9 31.4 9 36 9 40 12.9 40 18.3 40 28.4 24 37.5 24 37.5Z" fill="#fff"/><path d="M14.5 23.5h3.2l2.1-5 3.4 10.5 2.4-6.6 1.6 2.1h6.3" fill="none" stroke="#ff3d77" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>두<i>근</i></b></div>
    <div class="desc">지금 적용된 형태</div>
  </div>

  <!-- B: 박동선 카빙(네거티브) -->
  <div class="card">
    <span class="num">B · 카빙(추천)</span>
    <div class="big">
      <svg class="ic" width="92" height="92" viewBox="0 0 48 48" fill="none"><defs><linearGradient id="tb" x1="6" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="#ff8fb1"/><stop offset="1" stop-color="#ff3d77"/></linearGradient><linearGradient id="gb" x1="24" y1="0" x2="24" y2="13" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="mb"><path d="M24 38S7 28.6 7 18.1C7 12.4 11.2 8.3 16.1 8.3c3.2 0 6 1.8 7.9 4.5C25.9 10.1 28.7 8.3 31.9 8.3 36.8 8.3 41 12.4 41 18.1 41 28.6 24 38 24 38Z" fill="#fff"/><path d="M12.5 23.5h4.3l2.4-6.4 3.7 12.4 2.7-7.8 1.9 2.6h6.3" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><rect width="48" height="48" rx="13" fill="url(#tb)"/><path d="M13 0h22c7.2 0 13 5.8 13 13H0C0 5.8 5.8 0 13 0Z" fill="url(#gb)"/><rect width="48" height="48" fill="#fff" mask="url(#mb)"/></svg>
    </div>
    <div class="row"><svg class="ic" width="34" height="34" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="13" fill="url(#tb)"/><rect width="48" height="48" fill="#fff" mask="url(#mb)"/></svg><b>두<i>근</i></b></div>
    <div class="desc"><b>박동선을 하트에서 파냄</b><br>분홍이 비쳐 더 고급스럽고 또렷</div>
  </div>

  <!-- C: 굵은 박동선 + 피크 점 -->
  <div class="card">
    <span class="num">C · 볼드 + 점</span>
    <div class="big">
      <svg class="ic" width="92" height="92" viewBox="0 0 48 48" fill="none"><defs><linearGradient id="tc" x1="6" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="#ff8fb1"/><stop offset="1" stop-color="#ff3d77"/></linearGradient><linearGradient id="gc" x1="24" y1="0" x2="24" y2="13" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#tc)"/><path d="M13 0h22c7.2 0 13 5.8 13 13H0C0 5.8 5.8 0 13 0Z" fill="url(#gc)"/><path d="M24 38S7 28.6 7 18.1C7 12.4 11.2 8.3 16.1 8.3c3.2 0 6 1.8 7.9 4.5C25.9 10.1 28.7 8.3 31.9 8.3 36.8 8.3 41 12.4 41 18.1 41 28.6 24 38 24 38Z" fill="#fff"/><path d="M13.5 24h4l2.3-6.2 3.6 11.5 2.6-7 1.8 1.7H34" fill="none" stroke="#ff3d77" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21.8" cy="29.3" r="1.7" fill="#ff3d77"/></svg>
    </div>
    <div class="row"><svg class="ic" width="34" height="34" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="13" fill="url(#tc)"/><path d="M24 38S7 28.6 7 18.1C7 12.4 11.2 8.3 16.1 8.3c3.2 0 6 1.8 7.9 4.5C25.9 10.1 28.7 8.3 31.9 8.3 36.8 8.3 41 12.4 41 18.1 41 28.6 24 38 24 38Z" fill="#fff"/><path d="M13.5 24h4l2.3-6.2 3.6 11.5 2.6-7 1.8 1.7H34" fill="none" stroke="#ff3d77" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21.8" cy="29.3" r="1.7" fill="#ff3d77"/></svg><b>두<i>근</i></b></div>
    <div class="desc"><b>박동선 굵게 + 피크에 점</b><br>작아도 잘 보이는 또렷한 버전</div>
  </div>

  <!-- D: 원형 + 카빙 -->
  <div class="card">
    <span class="num">D · 원형</span>
    <div class="big">
      <svg class="ic" width="92" height="92" viewBox="0 0 48 48" fill="none"><defs><linearGradient id="td" x1="6" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="#ff8fb1"/><stop offset="1" stop-color="#ff3d77"/></linearGradient><mask id="md"><path d="M24 38S7 28.6 7 18.1C7 12.4 11.2 8.3 16.1 8.3c3.2 0 6 1.8 7.9 4.5C25.9 10.1 28.7 8.3 31.9 8.3 36.8 8.3 41 12.4 41 18.1 41 28.6 24 38 24 38Z" fill="#fff"/><path d="M12.5 23.5h4.3l2.4-6.4 3.7 12.4 2.7-7.8 1.9 2.6h6.3" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><circle cx="24" cy="24" r="24" fill="url(#td)"/><rect width="48" height="48" fill="#fff" mask="url(#md)"/></svg>
    </div>
    <div class="row"><svg class="ic" width="34" height="34" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="24" fill="url(#td)"/><rect width="48" height="48" fill="#fff" mask="url(#md)"/></svg><b>두<i>근</i></b></div>
    <div class="desc"><b>원형 배지 + 카빙 박동선</b><br>부드럽고 친근한 느낌</div>
  </div>

</div>
</body></html>
