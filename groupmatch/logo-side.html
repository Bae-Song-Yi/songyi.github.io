<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근 · 펄스 옆 배치</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--accent:#ff4f82;--accent2:#ff84a8;--ink:#43232f;--muted:#bd8b9c;--rose:#f5326f;--soft:#ffe0ea}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  body{background:linear-gradient(160deg,#ffeef4,#ffe0ea);color:var(--ink);padding:30px 16px 60px;-webkit-font-smoothing:antialiased}
  h1{text-align:center;font-size:21px;font-weight:800}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 26px}
  .grid{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
  .card{background:#fff;border-radius:24px;padding:26px 22px 22px;box-shadow:0 18px 44px -22px rgba(150,50,90,.5);text-align:center}
  .num{display:inline-block;font-size:12px;font-weight:800;color:var(--rose);background:var(--soft);padding:5px 12px;border-radius:20px;margin-bottom:20px}
  .stage{display:flex;align-items:center;justify-content:center;gap:34px;height:80px;margin-bottom:14px}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.5}
  .lk{display:inline-flex;align-items:center}
  .lk b{font-weight:800;letter-spacing:-1px}
  .lk b i{color:var(--accent);font-style:normal}
  .big b{font-size:46px;letter-spacing:-2px}.sml b{font-size:23px}
  .big svg{height:34px}.sml svg{height:18px}
  svg{width:auto;display:block}
</style></head>
<body>
<h1>심장박동 라인 = 글자 옆 · 세로 중앙 💗</h1>
<div class="sub">왼쪽 크게 / 오른쪽 실제 로고 크기.</div>
<div class="grid">

  <!-- 1 오른쪽 -->
  <div class="card">
    <span class="num">1 · 오른쪽</span>
    <div class="stage">
      <span class="lk big"><b>두<i>근</i></b><svg viewBox="0 0 70 24" fill="none" style="margin-left:8px"><path d="M2 12h12l3-7 4.5 15 3.5-10 2.5 4h10" stroke="url(#r1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 7c-1.7-2.6-5.4-2-5.4 1.3 0 2.2 2.7 4.2 5.4 6 2.7-1.8 5.4-3.8 5.4-6C63.4 5 59.7 4.4 58 7Z" fill="#ff3d77"/><defs><linearGradient id="r1" x1="0" y1="0" x2="70" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff3d77"/></linearGradient></defs></svg></span>
      <span class="lk sml"><b>두<i>근</i></b><svg viewBox="0 0 70 24" fill="none" style="margin-left:5px"><path d="M2 12h12l3-7 4.5 15 3.5-10 2.5 4h10" stroke="url(#r1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 7c-1.7-2.6-5.4-2-5.4 1.3 0 2.2 2.7 4.2 5.4 6 2.7-1.8 5.4-3.8 5.4-6C63.4 5 59.7 4.4 58 7Z" fill="#ff3d77"/></svg></span>
    </div>
    <div class="desc">두근 <b style="color:var(--ink)">오른쪽</b>에 박동선 + 하트</div>
  </div>

  <!-- 2 왼쪽 -->
  <div class="card">
    <span class="num">2 · 왼쪽</span>
    <div class="stage">
      <span class="lk big"><svg viewBox="0 0 70 24" fill="none" style="margin-right:8px"><path d="M12 7c-1.7-2.6-5.4-2-5.4 1.3 0 2.2 2.7 4.2 5.4 6 2.7-1.8 5.4-3.8 5.4-6C17.4 5 13.7 4.4 12 7Z" fill="#ff3d77"/><path d="M22 12h8l3-7 4.5 15 3.5-10 2.5 4h22" stroke="url(#r2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="r2" x1="0" y1="0" x2="70" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#ff3d77"/><stop offset="1" stop-color="#ff84a8"/></linearGradient></defs></svg><b>두<i>근</i></b></span>
      <span class="lk sml"><svg viewBox="0 0 70 24" fill="none" style="margin-right:5px"><path d="M12 7c-1.7-2.6-5.4-2-5.4 1.3 0 2.2 2.7 4.2 5.4 6 2.7-1.8 5.4-3.8 5.4-6C17.4 5 13.7 4.4 12 7Z" fill="#ff3d77"/><path d="M22 12h8l3-7 4.5 15 3.5-10 2.5 4h22" stroke="url(#r2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>두<i>근</i></b></span>
    </div>
    <div class="desc">두근 <b style="color:var(--ink)">왼쪽</b>에 하트 + 박동선</div>
  </div>

  <!-- 3 오른쪽 라인만(하트 없이) -->
  <div class="card">
    <span class="num">3 · 오른쪽(라인만)</span>
    <div class="stage">
      <span class="lk big"><b>두<i>근</i></b><svg viewBox="0 0 64 24" fill="none" style="margin-left:8px"><path d="M2 12h14l3.5-8 5 16 4-11 3 4h29" stroke="url(#r3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="r3" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff3d77"/></linearGradient></defs></svg></span>
      <span class="lk sml"><b>두<i>근</i></b><svg viewBox="0 0 64 24" fill="none" style="margin-left:5px"><path d="M2 12h14l3.5-8 5 16 4-11 3 4h29" stroke="url(#r3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <div class="desc">하트 없이 깔끔한 박동선만</div>
  </div>

</div>
</body></html>
