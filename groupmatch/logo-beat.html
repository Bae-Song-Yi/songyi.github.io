<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근 · 심장박동 로고 모음</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--accent:#ff4f82;--accent2:#ff84a8;--ink:#43232f;--muted:#bd8b9c;--rose:#f5326f;--soft:#ffe0ea}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  body{background:linear-gradient(160deg,#ffeef4,#ffe0ea);color:var(--ink);padding:30px 16px 60px;-webkit-font-smoothing:antialiased}
  h1{text-align:center;font-size:21px;font-weight:800}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 26px}
  .grid{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .card{background:#fff;border-radius:24px;padding:24px 20px 20px;box-shadow:0 18px 44px -22px rgba(150,50,90,.5);text-align:center}
  .num{display:inline-block;font-size:12px;font-weight:800;color:var(--rose);background:var(--soft);padding:5px 12px;border-radius:20px;margin-bottom:18px}
  .big{display:flex;justify-content:center;align-items:center;height:74px;margin-bottom:14px}
  .lk{display:inline-flex;align-items:center;gap:9px;margin-bottom:12px}
  .lk b{font-size:23px;font-weight:800;letter-spacing:-1px}
  .lk b i{color:var(--accent);font-style:normal}
  .desc{font-size:12px;color:var(--muted);line-height:1.5}
  .sh{filter:drop-shadow(0 5px 10px rgba(255,61,119,.4))}
</style></head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff3d77"/></linearGradient>
  <linearGradient id="tile" x1="6" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="#ff8fb1"/><stop offset="1" stop-color="#ff3d77"/></linearGradient>
</defs></svg>

<h1>심장박동 로고 모음 💗</h1>
<div class="sub">새 컨셉 6종. 마음에 드는 번호를 알려주세요.</div>
<div class="grid">

  <!-- 7 라인→하트 -->
  <div class="card"><span class="num">7 · 라인→하트</span>
    <div class="big"><svg class="sh" width="86" height="58" viewBox="0 0 60 40" fill="none"><path d="M3 22h11l3-7 4 15 3-10 2 4h3" stroke="url(#ac)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 35S31 27.2 31 19.3C31 14.8 34.2 12 37.7 12c2.3 0 4.3 1.3 6.3 4 2-2.7 4-4 6.3-4C53.8 12 57 14.8 57 19.3 57 27.2 44 35 44 35Z" fill="url(#ac)"/></svg></div>
    <div class="lk"><svg width="34" height="23" viewBox="0 0 60 40" fill="none"><path d="M3 22h11l3-7 4 15 3-10 2 4h3" stroke="url(#ac)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 35S31 27.2 31 19.3C31 14.8 34.2 12 37.7 12c2.3 0 4.3 1.3 6.3 4 2-2.7 4-4 6.3-4C53.8 12 57 14.8 57 19.3 57 27.2 44 35 44 35Z" fill="url(#ac)"/></svg><b>두<i>근</i></b></div>
    <div class="desc">박동선이 하트로 이어지는 한 줄</div>
  </div>

  <!-- 8 모노라인 하트 -->
  <div class="card"><span class="num">8 · 모노라인 하트</span>
    <div class="big"><svg width="64" height="60" viewBox="0 0 48 44" fill="none"><path d="M24 39S6 28.5 6 16.8C6 11 10.2 7 15.2 7c3.4 0 6.3 1.9 8.8 4.8C26.5 8.9 29.4 7 32.8 7 37.8 7 42 11 42 16.8 42 28.5 24 39 24 39Z" stroke="url(#ac)" stroke-width="3"/><path d="M11 18.5h6l2.6-5.5 3 9 2.2-4.5h12" stroke="url(#ac)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="lk"><svg width="30" height="28" viewBox="0 0 48 44" fill="none"><path d="M24 39S6 28.5 6 16.8C6 11 10.2 7 15.2 7c3.4 0 6.3 1.9 8.8 4.8C26.5 8.9 29.4 7 32.8 7 37.8 7 42 11 42 16.8 42 28.5 24 39 24 39Z" stroke="url(#ac)" stroke-width="3"/><path d="M11 18.5h6l2.6-5.5 3 9 2.2-4.5h12" stroke="url(#ac)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><b>두<i>근</i></b></div>
    <div class="desc">선으로만 그린 하트 + 박동 (가볍고 모던)</div>
  </div>

  <!-- 9 원형 배지 -->
  <div class="card"><span class="num">9 · 원형 배지</span>
    <div class="big"><svg class="sh" width="62" height="62" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="24" fill="url(#tile)"/><path d="M9 25h6l3-8 4.2 16 3-11 2 3h7.8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="lk"><svg class="sh" width="32" height="32" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="24" fill="url(#tile)"/><path d="M9 25h6l3-8 4.2 16 3-11 2 3h7.8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>두<i>근</i></b></div>
    <div class="desc">원형 배지 + 흰 박동선</div>
  </div>

  <!-- 10 하트 카빙(타일X) -->
  <div class="card"><span class="num">10 · 하트 카빙</span>
    <div class="big"><svg width="58" height="56" viewBox="0 0 48 44" fill="none"><defs><mask id="cv"><path d="M24 39S6 28.5 6 16.8C6 11 10.2 7 15.2 7c3.4 0 6.3 1.9 8.8 4.8C26.5 8.9 29.4 7 32.8 7 37.8 7 42 11 42 16.8 42 28.5 24 39 24 39Z" fill="#fff"/><path d="M11 19h6l2.6-6 3.4 11 2.4-7 1.8 2H37" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><rect width="48" height="44" fill="url(#ac)" mask="url(#cv)"/></svg></div>
    <div class="lk"><svg width="30" height="28" viewBox="0 0 48 44" fill="none"><rect width="48" height="44" fill="url(#ac)" mask="url(#cv)"/></svg><b>두<i>근</i></b></div>
    <div class="desc">꽉 찬 하트에 박동선을 파냄 (또렷)</div>
  </div>

  <!-- 11 알약 배지 -->
  <div class="card"><span class="num">11 · 알약 배지</span>
    <div class="big"><svg class="sh" width="96" height="48" viewBox="0 0 80 40" fill="none"><rect width="80" height="40" rx="20" fill="url(#tile)"/><path d="M14 35S5 29 5 22.5C5 19 7.5 16.5 10.5 16.5c2 0 3.7 1.1 4.5 2.7.8-1.6 2.5-2.7 4.5-2.7 3 0 5.5 2.5 5.5 6C30 29 14 35 14 35Z" transform="translate(0 -7) scale(.62) translate(8 8)" fill="#fff"/><path d="M34 21h7l3-7 4 14 3-9 2 3h21" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="lk"><svg class="sh" width="60" height="30" viewBox="0 0 80 40" fill="none"><rect width="80" height="40" rx="20" fill="url(#tile)"/><path d="M34 21h7l3-7 4 14 3-9 2 3h21" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="20" r="6" fill="#fff"/></svg><b>두<i>근</i></b></div>
    <div class="desc">가로 알약형 배지 + 박동선</div>
  </div>

  <!-- 12 더블 비트 하트 -->
  <div class="card"><span class="num">12 · 더블비트</span>
    <div class="big"><svg class="sh" width="62" height="56" viewBox="0 0 48 44" fill="none"><path d="M24 39S6 28.5 6 16.8C6 11 10.2 7 15.2 7c3.4 0 6.3 1.9 8.8 4.8C26.5 8.9 29.4 7 32.8 7 37.8 7 42 11 42 16.8 42 28.5 24 39 24 39Z" fill="url(#ac)"/><path d="M10 22h4l2-4 2.5 7 2-9 2.5 11 2-5 1.6 2.5 1.4-1.5h6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="lk"><svg class="sh" width="30" height="28" viewBox="0 0 48 44" fill="none"><path d="M24 39S6 28.5 6 16.8C6 11 10.2 7 15.2 7c3.4 0 6.3 1.9 8.8 4.8C26.5 8.9 29.4 7 32.8 7 37.8 7 42 11 42 16.8 42 28.5 24 39 24 39Z" fill="url(#ac)"/><path d="M10 22h4l2-4 2.5 7 2-9 2.5 11 2-5 1.6 2.5 1.4-1.5h6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>두<i>근</i></b></div>
    <div class="desc">하트 안에 두 번 뛰는 박동 (두-근)</div>
  </div>

</div>
</body></html>
