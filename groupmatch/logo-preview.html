<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근 로고 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--accent:#ff4f82;--accent2:#ff84a8;--ink:#43232f;--muted:#bd8b9c;--rose:#f5326f;--soft:#ffe0ea}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  body{background:linear-gradient(160deg,#fff5f8,#ffe9f0);color:var(--ink);padding:32px 18px 60px;-webkit-font-smoothing:antialiased}
  h1{text-align:center;font-size:22px;font-weight:800;margin-bottom:6px}
  .sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:28px}
  .grid{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .card{background:#fff;border-radius:22px;padding:26px 22px 20px;box-shadow:0 18px 40px -22px rgba(150,50,90,.5);display:flex;flex-direction:column;align-items:center;gap:18px}
  .num{align-self:flex-start;font-size:12px;font-weight:800;color:var(--rose);background:var(--soft);padding:5px 11px;border-radius:20px;letter-spacing:.5px}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:96px}
  .name{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
  .name b{color:var(--ink);font-weight:700}

  /* 공통 로고 텍스트 */
  .wm{display:flex;align-items:center;gap:10px}
  .wm b{font-size:24px;font-weight:800;letter-spacing:-1px}
  .wm b i{color:var(--accent);font-style:normal}

  /* 1) 현재안 - 분홍 타일 + 단색 하트 */
  .t-tile{width:40px;height:40px;border-radius:11px;background:linear-gradient(140deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}

  /* 6) 원형 배지 */
  .badge{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -8px rgba(255,79,130,.7)}
</style>
</head>
<body>
  <h1>두근 로고 시안 💗</h1>
  <div class="sub">마음에 드는 번호를 알려주세요. (색·크기 등 세부 조정 가능)</div>

  <div class="grid">

    <!-- 1 현재안 -->
    <div class="card">
      <span class="num">01 · 현재안</span>
      <div class="stage">
        <div class="wm"><span class="t-tile">♥</span><b>두<i>근</i></b></div>
      </div>
      <div class="name"><b>분홍 타일 + 단색 하트</b><br>지금 적용돼 있는 형태</div>
    </div>

    <!-- 2 하트비트(두근거림) -->
    <div class="card">
      <span class="num">02 · 두근비트</span>
      <div class="stage">
        <div class="wm">
          <svg width="42" height="42" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="13" fill="url(#g2)"/>
            <path d="M24 35s-9.2-5.6-12-11.3C9.5 18.6 12 14 16.4 14c2.8 0 4.7 1.6 5.6 3.2.9-1.6 2.8-3.2 5.6-3.2 4.4 0 6.9 4.6 4.4 9.7C33.2 29.4 24 35 24 35z" fill="#fff" opacity=".25"/>
            <path d="M11 25h6l2.5-6 4 12 3-9 2 3h8.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <defs><linearGradient id="g2" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff4f82"/></linearGradient></defs>
          </svg>
          <b>두<i>근</i></b>
        </div>
      </div>
      <div class="name"><b>하트 + 심장박동(두근거림)</b><br>이름 뜻을 직관적으로</div>
    </div>

    <!-- 3 겹친 두 하트(연결) -->
    <div class="card">
      <span class="num">03 · 두 하트</span>
      <div class="stage">
        <div class="wm">
          <svg width="44" height="40" viewBox="0 0 56 48" fill="none">
            <path d="M19 42S6 34 6 22C6 15 11 11 16 12c3 .6 5 3 6 5 1-2 3-4.4 6-5 5-1 10 3 10 10 0 12-13 20-13 20z" fill="#ffa9c4"/>
            <path d="M33 40S22 33 22 22c0-6 4.3-9.6 8.6-8.8 2.6.5 4.4 2.6 5.4 4.3.9-1.7 2.8-3.8 5.4-4.3C45.7 12.4 50 16 50 22c0 11-11 18-11 18z" fill="url(#g3)"/>
            <defs><linearGradient id="g3" x1="22" y1="13" x2="50" y2="40"><stop stop-color="#ff5f8e"/><stop offset="1" stop-color="#e8366c"/></linearGradient></defs>
          </svg>
          <b>두<i>근</i></b>
        </div>
      </div>
      <div class="name"><b>겹친 두 하트</b><br>둘이 이어지는 소개팅 느낌</div>
    </div>

    <!-- 4 말풍선 + 하트 -->
    <div class="card">
      <span class="num">04 · 하트 말풍선</span>
      <div class="stage">
        <div class="wm">
          <svg width="42" height="42" viewBox="0 0 48 48" fill="none">
            <path d="M8 10c0-2.2 1.8-4 4-4h24c2.2 0 4 1.8 4 4v20c0 2.2-1.8 4-4 4H20l-8 7v-7h0c-2.2 0-4-1.8-4-4V10z" fill="url(#g4)"/>
            <path d="M24 28s-6.4-3.8-8.2-7.6c-1.6-3.4 0-6.6 3-6.6 1.9 0 3.2 1.1 3.8 2.2.6-1.1 1.9-2.2 3.8-2.2 3 0 4.6 3.2 3 6.6C30.4 24.2 24 28 24 28z" fill="#fff"/>
            <defs><linearGradient id="g4" x1="8" y1="6" x2="40" y2="41"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff4f82"/></linearGradient></defs>
          </svg>
          <b>두<i>근</i></b>
        </div>
      </div>
      <div class="name"><b>말풍선 속 하트</b><br>대화·매칭 서비스 느낌</div>
    </div>

    <!-- 5 워드마크형(하트가 점) -->
    <div class="card">
      <span class="num">05 · 워드마크</span>
      <div class="stage">
        <div style="position:relative;display:inline-block">
          <b style="font-size:34px;font-weight:800;letter-spacing:-1.5px;color:var(--ink)">두<span style="color:var(--accent)">근</span></b>
          <svg width="16" height="15" viewBox="0 0 24 22" style="position:absolute;top:-6px;right:-12px" fill="none">
            <path d="M12 21S1 13.5 1 6.8C1 2.9 4 .5 7.4 1.4 9.5 2 11 3.8 12 5.4 13 3.8 14.5 2 16.6 1.4 20 .5 23 2.9 23 6.8 23 13.5 12 21 12 21z" fill="url(#g5)"/>
            <defs><linearGradient id="g5" x1="1" y1="1" x2="23" y2="21"><stop stop-color="#ff84a8"/><stop offset="1" stop-color="#ff4f82"/></linearGradient></defs>
          </svg>
        </div>
      </div>
      <div class="name"><b>텍스트 중심 + 작은 하트</b><br>아이콘 없이 심플하게</div>
    </div>

    <!-- 6 원형 배지 -->
    <div class="card">
      <span class="num">06 · 원형 배지</span>
      <div class="stage">
        <div class="wm">
          <span class="badge">
            <svg width="22" height="20" viewBox="0 0 24 22" fill="none">
              <path d="M12 21S1 13.5 1 6.8C1 2.9 4 .5 7.4 1.4 9.5 2 11 3.8 12 5.4 13 3.8 14.5 2 16.6 1.4 20 .5 23 2.9 23 6.8 23 13.5 12 21 12 21z" fill="#fff"/>
            </svg>
          </span>
          <b>두<i>근</i></b>
        </div>
      </div>
      <div class="name"><b>원형 배지 + 하트</b><br>부드럽고 친근한 느낌</div>
    </div>

  </div>
</body>
</html>
