<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두근 · 더블비트 업그레이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--accent:#ff4f82;--accent2:#ff84a8;--ink:#43232f;--muted:#bd8b9c;--rose:#f5326f;--soft:#ffe0ea}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  body{background:linear-gradient(160deg,#ffeef4,#ffe0ea);color:var(--ink);padding:30px 16px 60px;-webkit-font-smoothing:antialiased}
  h1{text-align:center;font-size:21px;font-weight:800}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 26px}
  .grid{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
  .card{background:#fff;border-radius:24px;padding:24px 20px 20px;box-shadow:0 18px 44px -22px rgba(150,50,90,.5);text-align:center}
  .num{display:inline-block;font-size:12px;font-weight:800;color:var(--rose);background:var(--soft);padding:5px 12px;border-radius:20px;margin-bottom:18px}
  .stage{display:flex;align-items:center;justify-content:center;gap:30px;height:82px;margin-bottom:12px}
  .lk{display:inline-flex;align-items:center;gap:9px}
  .lk b{font-size:23px;font-weight:800;letter-spacing:-1px}
  .lk b i{color:var(--accent);font-style:normal}
  .desc{font-size:12px;color:var(--muted);line-height:1.5}
  .sh{filter:drop-shadow(0 5px 11px rgba(255,61,119,.42))}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="ac" x1="6" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#ff8fb1"/><stop offset="1" stop-color="#ff3d77"/></linearGradient>
</defs></svg>

<h1>12번 · 더블비트 업그레이드 💗</h1>
<div class="sub">왼쪽 크게 / 오른쪽 실제 크기. 마음에 드는 번호를 알려주세요.</div>
<div class="grid">

  <!-- A 정돈된 더블비트 + 광택 -->
  <div class="card"><span class="num">12A · 정돈+광택</span>
    <div class="stage">
      <svg class="sh" width="72" height="66" viewBox="0 0 48 44" fill="none"><path d="M24 39S6 28.5 6 16.8C6 11 10.2 7 15.2 7c3.4 0 6.3 1.9 8.8 4.8C26.5 8.9 29.4 7 32.8 7 37.8 7 42 11 42 16.8 42 28.5 24 39 24 39Z" fill="url(#ac)"/><path d="M13.5 10.5c-2.6 1.2-4.2 3.5-4.3 6.6" stroke="#fff" stroke-opacity=".55" stroke-width="2.3" stroke-linecap="round"/><path d="M8 24H13l1.8-6 2.6 12 2.6-12 1.8 6H22l1.8-7 2.8 14 2.8-14 1.8 7H40" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lk"><svg class="sh" width="33" height="30" viewBox="0 0 48 44" fill="none"><path d="M24 39S6 28.5 6 16.8C6 11 10.2 7 15.2 7c3.4 0 6.3 1.9 8.8 4.8C26.5 8.9 29.4 7 32.8 7 37.8 7 42 11 42 16.8 42 28.5 24 39 24 39Z" fill="url(#ac)"/><path d="M13.5 10.5c-2.6 1.2-4.2 3.5-4.3 6.6" stroke="#fff" stroke-opacity=".55" stroke-width="2.3" stroke-linecap="round"/><path d="M8 24H13l1.8-6 2.6 12 2.6-12 1.8 6H22l1.8-7 2.8 14 2.8-14 1.8 7H40" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg><b>두<i>근</i></b></span>
    </div>
    <div class="desc">두 번 뛰는 박동 정돈 + 상단 광택</div>
  </div>

  <!-- B 카빙 더블비트 -->
  <div class="card"><span class="num">12B · 카빙</span>
    <div class="stage">
      <svg class="sh" width="72" height="66" viewBox="0 0 48 44" fill="none"><defs><mask id="mb"><path d="M24 39S6 28.5 6 16.8C6 11 10.2 7 15.2 7c3.4 0 6.3 1.9 8.8 4.8C26.5 8.9 29.4 7 32.8 7 37.8 7 42 11 42 16.8 42 28.5 24 39 24 39Z" fill="#fff"/><path d="M8 24H13l1.8-6 2.6 12 2.6-12 1.8 6H22l1.8-7 2.8 14 2.8-14 1.8 7H40" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><rect width="48" height="44" fill="url(#ac)" mask="url(#mb)"/></svg>
      <span class="lk"><svg class="sh" width="33" height="30" viewBox="0 0 48 44" fill="none"><rect width="48" height="44" fill="url(#ac)" mask="url(#mb)"/></svg><b>두<i>근</i></b></span>
    </div>
    <div class="desc">박동을 하트에서 파냄 (분홍/흰 대비, 고급)</div>
  </div>

  <!-- C 둥근 하트 + 또렷 비트 + 피크 점 -->
  <div class="card"><span class="num">12C · 또렷+점</span>
    <div class="stage">
      <svg class="sh" width="72" height="66" viewBox="0 0 48 44" fill="none"><path d="M24 39S6 28.5 6 16.8C6 11 10.2 7 15.2 7c3.4 0 6.3 1.9 8.8 4.8C26.5 8.9 29.4 7 32.8 7 37.8 7 42 11 42 16.8 42 28.5 24 39 24 39Z" fill="url(#ac)"/><path d="M9 25h4.5l1.8-5 2.5 10 2.4-9 2 4h2.3l1.8-6 2.8 13 2.6-12 1.8 5H39" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lk"><svg class="sh" width="33" height="30" viewBox="0 0 48 44" fill="none"><path d="M24 39S6 28.5 6 16.8C6 11 10.2 7 15.2 7c3.4 0 6.3 1.9 8.8 4.8C26.5 8.9 29.4 7 32.8 7 37.8 7 42 11 42 16.8 42 28.5 24 39 24 39Z" fill="url(#ac)"/><path d="M9 25h4.5l1.8-5 2.5 10 2.4-9 2 4h2.3l1.8-6 2.8 13 2.6-12 1.8 5H39" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><b>두<i>근</i></b></span>
    </div>
    <div class="desc">더 또렷한 두-근 박동선</div>
  </div>

  <!-- D 라운드 타일 + 더블비트 -->
  <div class="card"><span class="num">12D · 타일형</span>
    <div class="stage">
      <svg class="sh" width="66" height="66" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="13" fill="url(#ac)"/><path d="M13 0h22c7.2 0 13 5.8 13 13H0C0 5.8 5.8 0 13 0Z" fill="#fff" fill-opacity=".18"/><path d="M24 38S9 29 9 19.5C9 14.8 12.5 12 16 12c2.8 0 5.2 1.6 7 4 1.8-2.4 4.2-4 7-4 3.5 0 7 2.8 7 7.5C44 29 24 38 24 38Z" fill="#fff"/><path d="M13 24h3.4l1.5-4.5 2.2 9.5 2-8.5 1.6 3.5h1.8l1.5-5 2.4 11 2.2-10 1.5 4H35" stroke="#ff3d77" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lk"><svg class="sh" width="33" height="33" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="13" fill="url(#ac)"/><path d="M24 38S9 29 9 19.5C9 14.8 12.5 12 16 12c2.8 0 5.2 1.6 7 4 1.8-2.4 4.2-4 7-4 3.5 0 7 2.8 7 7.5C44 29 24 38 24 38Z" fill="#fff"/><path d="M13 24h3.4l1.5-4.5 2.2 9.5 2-8.5 1.6 3.5h1.8l1.5-5 2.4 11 2.2-10 1.5 4H35" stroke="#ff3d77" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>두<i>근</i></b></span>
    </div>
    <div class="desc">현재 타일 안에 흰 하트 + 두-근 박동</div>
  </div>

</div>
</body></html>
